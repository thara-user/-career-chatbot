apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerbot-ai
  labels:
    app: careerbot-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: careerbot-ai
  template:
    metadata:
      labels:
        app: careerbot-ai
    spec:
      containers:
      - name: careerbot-ai
        image: careerbot-ai:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: careerbot-secrets
              key: GROQ_API_KEY
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
