<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career Prompt Engineer</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f3;
      --bg-tertiary: #efefed;
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b68;
      --text-tertiary: #9e9e9b;
      --border-light: rgba(0,0,0,0.10);
      --border-mid: rgba(0,0,0,0.18);
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg-tertiary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app-shell {
      width: 100%;
      max-width: 760px;
      background: var(--bg-primary);
      border-radius: 16px;
      border: 0.5px solid var(--border-light);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 90vh;
      max-height: 860px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.08);
    }

    /* ─── HEADER ─── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 22px;
      border-bottom: 0.5px solid var(--border-light);
      background: var(--bg-primary);
      flex-shrink: 0;
    }

    .logo {
      width: 38px; height: 38px;
      background: #1a1a1a;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff;
      flex-shrink: 0;
    }

    .header-text h1 { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .header-text p  { font-size: 12px; color: var(--text-secondary); }

    .status-pill {
      margin-left: auto;
      background: #EAF3DE; color: #3B6D11;
      font-size: 11px; font-weight: 500;
      padding: 4px 12px; border-radius: 20px;
      border: 0.5px solid #C0DD97;
      display: flex; align-items: center; gap: 6px;
    }

    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #639922;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ─── CHAT AREA ─── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 4px; }

    /* ─── WELCOME CARD ─── */
    .welcome-card {
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      text-align: center;
    }

    .welcome-icon { font-size: 32px; margin-bottom: 12px; }
    .welcome-card h2 { font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
    .welcome-card p  { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 20px; }

    .chips {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    }

    .chip {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-mid);
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 12px; font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Syne', sans-serif;
    }

    .chip:hover {
      background: #1a1a1a; color: #fff;
      border-color: #1a1a1a;
    }

    /* ─── MESSAGES ─── */
    .msg { display: flex; gap: 10px; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      flex-shrink: 0;
    }

    .avatar.bot  { background: #1a1a1a; color: #fff; }
    .avatar.user { background: #B5D4F4; color: #0C447C; }

    .bubble {
      max-width: 82%;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-primary);
    }

    .msg.user .bubble {
      background: #042C53;
      color: #E6F1FB;
      border-color: transparent;
    }

    /* ─── LEVEL BLOCKS ─── */
    .levels-wrapper { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }

    .intro-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .level-card {
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 0.5px solid var(--border-light);
    }

    .level-head {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      user-select: none;
    }

    .level-head.l1 { background: #F1EFE8; color: #5F5E5A; }
    .level-head.l2 { background: #E6F1FB; color: #185FA5; }
    .level-head.l3 { background: #EAF3DE; color: #3B6D11; }

    .level-badge {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
    }

    .l1 .level-badge { background: #D3D1C7; color: #444441; }
    .l2 .level-badge { background: #B5D4F4; color: #0C447C; }
    .l3 .level-badge { background: #C0DD97; color: #27500A; }

    .copy-btn {
      margin-left: auto;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 10px;
      font-family: 'Syne', sans-serif;
      cursor: pointer;
      border: 0.5px solid currentColor;
      background: transparent;
      color: inherit;
      opacity: 0.7;
      transition: opacity 0.15s;
    }
    .copy-btn:hover { opacity: 1; }

    .level-body {
      padding: 12px 14px;
      font-size: 12px; line-height: 1.8;
      font-family: 'DM Mono', monospace;
      color: var(--text-primary);
      background: var(--bg-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ─── THINKING ─── */
    .thinking { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-secondary);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* ─── HINTS ─── */
    .hint-strip {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding: 8px 22px 0;
      flex-shrink: 0;
    }

    .hint {
      font-size: 11px; font-family: 'Syne', sans-serif;
      padding: 5px 12px; border-radius: 20px;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-light);
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .hint:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* ─── INPUT ROW ─── */
    .input-row {
      display: flex; gap: 10px; align-items: flex-end;
      padding: 14px 22px 18px;
      border-top: 0.5px solid var(--border-light);
      background: var(--bg-primary);
      flex-shrink: 0;
    }

    .input-wrap { flex: 1; }

    textarea#userInput {
      width: 100%;
      border: 0.5px solid var(--border-mid);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      font-size: 13px;
      font-family: 'Syne', sans-serif;
      resize: none;
      min-height: 46px;
      max-height: 110px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      line-height: 1.5;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea#userInput:focus { border-color: #1a1a1a; }
    textarea#userInput::placeholder { color: var(--text-tertiary); }

    .send-btn {
      width: 46px; height: 46px;
      background: #1a1a1a; color: #fff;
      border: none; border-radius: var(--radius-md);
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s; flex-shrink: 0;
    }
    .send-btn:hover { opacity: 0.8; }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ─── ERROR ─── */
    .error-bubble {
      background: #FCEBEB;
      border: 0.5px solid #F09595;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 13px;
      color: #A32D2D;
    }

    /* ─── FOOTER ─── */
    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-tertiary);
      padding: 0 22px 14px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="app-shell">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">✦</div>
    <div class="header-text">
      <h1>Career Prompt Engineer</h1>
      <p>Generates Level 1 · 2 · 3 prompts using Claude API</p>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      Claude API
    </div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chatArea">
    <div class="welcome-card">
      <div class="welcome-icon">🎯</div>
      <h2>What career task do you need?</h2>
      <p>Describe your goal — I'll generate structured prompts at 3 levels of depth,<br/>ready to use with any AI tool.</p>
      <div class="chips">
        <button class="chip" onclick="quickSend('Create a resume for a fresher software engineer with Python and React skills')">📄 Resume Creation</button>
        <button class="chip" onclick="quickSend('Write a cover letter for a data analyst role at Google')">✉️ Cover Letter</button>
        <button class="chip" onclick="quickSend('Help me prepare for a product manager interview at a startup')">🎤 Interview Prep</button>
        <button class="chip" onclick="quickSend('Job search strategy for a mid-level UX designer switching industries')">🔍 Job Search</button>
      </div>
    </div>
  </div>

  <!-- HINT STRIP -->
  <div class="hint-strip">
    <button class="hint" onclick="quickSend('Resume for a DevOps fresher with AWS and Docker')">DevOps Resume</button>
    <button class="hint" onclick="quickSend('Cover letter for marketing manager at a tech startup')">Marketing Cover Letter</button>
    <button class="hint" onclick="quickSend('Prepare me for a data science technical interview')">DS Interview</button>
    <button class="hint" onclick="quickSend('How to find remote jobs as a frontend developer')">Remote Job Search</button>
  </div>

  <!-- INPUT ROW -->
  <div class="input-row">
    <div class="input-wrap">
      <textarea id="userInput" placeholder="e.g. I need a resume for a fresher DevOps engineer with AWS and Docker skills..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">↑</button>
  </div>

  <div class="footer">Powered by Anthropic Claude API &nbsp;·&nbsp; Career Prompt Engineering Tool</div>
</div>

<script>
  const chatArea   = document.getElementById('chatArea');
  const userInput  = document.getElementById('userInput');
  const sendBtn    = document.getElementById('sendBtn');

  // ── Auto-resize textarea ──
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  }

  // ── Enter to send ──
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  // ── Quick send from chips ──
  function quickSend(text) {
    userInput.value = text;
    autoResize(userInput);
    sendMessage();
  }

  // ── Add a message bubble ──
  function addMsg(role, content) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;

    const av = document.createElement('div');
    av.className = 'avatar ' + role;
    av.textContent = role === 'bot' ? '✦' : 'U';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (typeof content === 'string') {
      bubble.innerHTML = content;
    } else {
      bubble.appendChild(content);
    }

    wrap.appendChild(av);
    wrap.appendChild(bubble);
    chatArea.appendChild(wrap);
    chatArea.scrollTop = chatArea.scrollHeight;
    return bubble;
  }

  // ── Thinking animation ──
  function showThinking() {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'thinking';

    const av = document.createElement('div');
    av.className = 'avatar bot';
    av.textContent = '✦';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

    wrap.appendChild(av);
    wrap.appendChild(bubble);
    chatArea.appendChild(wrap);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeThinking() {
    const el = document.getElementById('thinking');
    if (el) el.remove();
  }

  // ── Build a prompt level card ──
  function makeCard(levelLabel, badgeText, colorClass, bodyText) {
    const card = document.createElement('div');
    card.className = 'level-card';

    const head = document.createElement('div');
    head.className = 'level-head ' + colorClass;
    head.innerHTML = `<span>${levelLabel}</span><span class="level-badge">${badgeText}</span>`;

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'Copy';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(bodyText).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy', 1800);
      });
    };
    head.appendChild(copyBtn);

    const body = document.createElement('div');
    body.className = 'level-body';
    body.textContent = bodyText;

    card.appendChild(head);
    card.appendChild(body);
    return card;
  }

  // ── Parse the Claude response into 3 levels ──
  function parsePrompts(raw) {
    const l1 = raw.match(/LEVEL\s*1[:\-]?\s*([\s\S]*?)(?=LEVEL\s*2|$)/i);
    const l2 = raw.match(/LEVEL\s*2[:\-]?\s*([\s\S]*?)(?=LEVEL\s*3|$)/i);
    const l3 = raw.match(/LEVEL\s*3[:\-]?\s*([\s\S]*?)$/i);
    return {
      l1: l1 ? l1[1].trim() : '',
      l2: l2 ? l2[1].trim() : '',
      l3: l3 ? l3[1].trim() : ''
    };
  }

  // ── Main send function ──
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;

    addMsg('user', text);
    showThinking();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Server error');
      }

      const data = await res.json();
      removeThinking();

      const parsed = parsePrompts(data.reply);
      const container = document.createElement('div');
      container.className = 'levels-wrapper';

      const intro = document.createElement('p');
      intro.className = 'intro-label';
      intro.textContent = 'Here are your 3 prompt levels — click Copy to use them:';
      container.appendChild(intro);

      if (parsed.l1) container.appendChild(makeCard('LEVEL 1', 'Basic Prompt', 'l1', parsed.l1));
      if (parsed.l2) container.appendChild(makeCard('LEVEL 2', 'Structured Prompt', 'l2', parsed.l2));
      if (parsed.l3) container.appendChild(makeCard('LEVEL 3', 'Expert Prompt', 'l3', parsed.l3));

      addMsg('bot', container);

    } catch (err) {
      removeThinking();
      const errDiv = document.createElement('div');
      errDiv.className = 'error-bubble';
      errDiv.textContent = '⚠️ Error: ' + err.message;
      addMsg('bot', errDiv);
    }

    sendBtn.disabled = false;
    userInput.focus();
  }
</script>
</body>
</html>
